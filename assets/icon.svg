<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#070913"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  
  <!-- Outer Spectrum Waves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#9d4edd" stroke-width="4" opacity="0.3" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f2fe" stroke-width="5" opacity="0.5" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ff007f" stroke-width="6" opacity="0.6"/>

  <!-- Center Vinyl Disc -->
  <circle cx="256" cy="256" r="100" fill="#0b0f19" stroke="url(#neonGrad)" stroke-width="8" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="256" cy="256" r="40" fill="url(#neonGrad)"/>

  <!-- Radio Antenna Icon -->
  <path d="M256 180 L256 256 M220 210 Q256 160 292 210 M195 185 Q256 125 317 185 M170 160 Q256 90 342 160" 
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>